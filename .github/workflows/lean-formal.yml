name: Lean formal invariants

on:
  push:
    branches: [main]
    paths:
      - "Phase1/formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  pull_request:
    paths:
      - "Phase1/formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare pinned Lean project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: Phase1/formal/lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Audit algebraic invariants
        working-directory: Phase1/formal/lean
        run: ./check.sh
